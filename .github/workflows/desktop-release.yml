name: Desktop SNS

# Compila os instaladores da casca desktop. Corre em tags v* e por execução
# manual (Actions → Desktop SNS → Run workflow). Os instaladores ficam como
# artefactos do workflow.
#
# O endereço do servidor vem da variável de repositório SNS_APP_URL
# (Settings → Secrets and variables → Actions → Variables). Se não estiver
# definida, usa-se o valor por omissão de scripts/config.mjs.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compilar:
    name: Compilar (${{ matrix.slug }})
    runs-on: ${{ matrix.plataforma }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - slug: macos-arm64
            plataforma: macos-latest
            args: '--target aarch64-apple-darwin --bundles dmg'
          - slug: macos-x64
            plataforma: macos-latest
            args: '--target x86_64-apple-darwin --bundles dmg'
          - slug: linux
            plataforma: ubuntu-22.04
            args: '--bundles deb,appimage'
          - slug: windows
            plataforma: windows-latest
            args: '--bundles nsis,msi'

    steps:
      - name: Obter o código
        uses: actions/checkout@v4

      - name: Dependências de sistema (Linux)
        if: matrix.plataforma == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ contains(matrix.args, 'apple-darwin') && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Cache de compilação Rust
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Dependências npm
        run: npm ci

      - name: Gerar o endereço do servidor
        env:
          SNS_APP_URL: ${{ vars.SNS_APP_URL }}
        run: node scripts/config.mjs

      - name: Compilar a aplicação
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: ${{ matrix.args }}

      - name: Publicar instaladores
        uses: actions/upload-artifact@v4
        with:
          name: sns-desktop-${{ matrix.slug }}
          path: src-tauri/target/**/release/bundle/**
          if-no-files-found: error

  publicar:
    name: Publicar release
    # Só em tags — numa execução manual (workflow_dispatch) não há versão para publicar.
    if: startsWith(github.ref, 'refs/tags/')
    needs: compilar
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Obter os artefactos dos 4 alvos
        uses: actions/download-artifact@v4
        with:
          path: artefactos

      - name: Escrever as notas do release
        run: |
          cat > notas.md <<'NOTAS'
          Instaladores da aplicação desktop do **SNS — Sistema Nacional de Saúde**.

          A aplicação abre a plataforma web numa janela nativa, sem barra de endereço. Para entrar são precisas credenciais do SNS.

          **Que ficheiro escolher:**

          | Sistema | Ficheiro |
          | --- | --- |
          | Windows | `.exe` (NSIS) ou `.msi` |
          | macOS com Apple Silicon (M1 ou posterior) | `.dmg` com `aarch64` no nome |
          | macOS com Intel | `.dmg` com `x64` no nome |
          | Linux | `.deb` (Ubuntu/Debian) ou `.AppImage` (portátil) |

          **Os instaladores não estão assinados.** O Windows mostra o aviso do SmartScreen — carregar em *Mais informações* e depois em *Executar assim mesmo*. No macOS, abrir com Ctrl+clique → *Abrir*. Sem este passo o sistema recusa a execução.
          NOTAS

      - name: Criar o release com os instaladores
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          # O job não faz checkout, por isso o gh não consegue inferir o
          # repositório a partir do diretório — daí o --repo explícito.
          # As mensagens de erro vão para anotações (::error) porque os
          # logs do Actions exigem autenticação, mas as anotações não.
          if ! saida=$(gh release create "$GITHUB_REF_NAME" \
              --repo "$REPO" \
              --title "SNS Desktop $GITHUB_REF_NAME" \
              --notes-file notas.md 2>&1); then
            echo "::error title=Falhou o gh release create::$saida"
            exit 1
          fi

          anexados=0
          while IFS= read -r ficheiro; do
            if ! saida=$(gh release upload "$GITHUB_REF_NAME" "$ficheiro" --repo "$REPO" --clobber 2>&1); then
              echo "::error title=Falhou o upload de $ficheiro::$saida"
              exit 1
            fi
            echo "anexado: $ficheiro"
            anexados=$((anexados + 1))
          done < <(find artefactos -type f \
            \( -name '*.dmg' -o -name '*.exe' -o -name '*.msi' -o -name '*.deb' -o -name '*.AppImage' -o -name '*.rpm' \))

          if [ "$anexados" -eq 0 ]; then
            echo "::error title=Release sem instaladores::nenhum ficheiro encontrado em artefactos/"
            exit 1
          fi

          echo "Release $GITHUB_REF_NAME publicado com $anexados instaladores."
