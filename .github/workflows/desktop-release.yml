name: Desktop SNS

# Compila os instaladores da casca desktop. Corre em tags v* e por execução
# manual (Actions → Desktop SNS → Run workflow). Os instaladores ficam como
# artefactos do workflow.
#
# O endereço do servidor vem da variável de repositório SNS_APP_URL
# (Settings → Secrets and variables → Actions → Variables). Se não estiver
# definida, usa-se o valor por omissão de scripts/config.mjs.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compilar:
    name: Compilar (${{ matrix.slug }})
    runs-on: ${{ matrix.plataforma }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - slug: macos-arm64
            plataforma: macos-latest
            args: '--target aarch64-apple-darwin --bundles dmg'
          - slug: macos-x64
            plataforma: macos-latest
            args: '--target x86_64-apple-darwin --bundles dmg'
          - slug: linux
            plataforma: ubuntu-22.04
            args: '--bundles deb,appimage'
          - slug: windows
            plataforma: windows-latest
            args: '--bundles nsis,msi'

    steps:
      - name: Obter o código
        uses: actions/checkout@v4

      - name: Dependências de sistema (Linux)
        if: matrix.plataforma == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ contains(matrix.args, 'apple-darwin') && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Cache de compilação Rust
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Dependências npm
        run: npm ci

      - name: Gerar o endereço do servidor
        env:
          SNS_APP_URL: ${{ vars.SNS_APP_URL }}
        run: node scripts/config.mjs

      - name: Compilar a aplicação
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: ${{ matrix.args }}

      - name: Publicar instaladores
        uses: actions/upload-artifact@v4
        with:
          name: sns-desktop-${{ matrix.slug }}
          path: src-tauri/target/**/release/bundle/**
          if-no-files-found: error

  publicar:
    name: Publicar release
    # Só em tags — numa execução manual (workflow_dispatch) não há versão para publicar.
    if: startsWith(github.ref, 'refs/tags/')
    needs: compilar
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Obter os artefactos dos 4 alvos
        uses: actions/download-artifact@v4
        with:
          path: artefactos

      - name: Criar o release com os instaladores
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "SNS Desktop $GITHUB_REF_NAME" \
            --notes "Instaladores da aplicação desktop do SNS — Sistema Nacional de Saúde.

          A aplicação abre a plataforma web numa janela nativa. Para entrar são precisas credenciais do SNS.

          **Escolher o ficheiro:**
          - Windows: \`.exe\` (NSIS) ou \`.msi\`
          - macOS: \`.dmg\` — \`aarch64\` para Apple Silicon (M1 ou posterior), \`x64\` para Intel
          - Linux: \`.deb\` ou \`.AppImage\`

          **Os instaladores não estão assinados.** O Windows mostra o aviso do SmartScreen (*Mais informações* → *Executar assim mesmo*) e o macOS exige Ctrl+clique → *Abrir* na primeira execução."

          find artefactos -type f \
            \( -name '*.dmg' -o -name '*.exe' -o -name '*.msi' -o -name '*.deb' -o -name '*.AppImage' -o -name '*.rpm' \) \
            -exec gh release upload "$GITHUB_REF_NAME" {} --clobber \;
